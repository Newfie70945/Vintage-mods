name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check C# identity and feed behavior
        run: dotnet run --project tests/Checks.csproj -c Release
      - name: Check connector authentication and lifecycle
        run: dotnet run --project modules/website-connector/tests/ConnectorSmoke.csproj -c Release
      - name: Check post-builder behavior
        run: node tests/editor-checks.js tests/web/motd-editor-Declarations.js
      - name: Validate embedded editor fixtures
        run: |
          node --check tests/web/motd-editor-Declarations.js
          node --check tests/web/motd-editor-Bindings.js
          python3 tools/check_sources.py
