name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check C# identity and feed behavior
        run: dotnet run --project tests/Checks.csproj -c Release
      - name: Check rollback planning, commands and exact-cell storage queries
        run: |
          dotnet run --project modules/suite/tests/RollbackRecoveryTests.csproj -c Release
          dotnet run --project modules/suite/tests/commands/RecoveryCommandTests.csproj -c Release
          python3 modules/suite/tests/test_recovery_sql.py
          python3 modules/suite/tests/test_recovery_sql_equivalence.py
          python3 modules/suite/tests/test_recovery_seek_cost.py
          dotnet run --project modules/suite/tests/recovery-performance/RecoveryPerformanceTests.csproj -c Release
      - name: Check coalesced snapshots, serialized responses and web incident matching
        run: |
          dotnet run --project modules/suite/tests/web/CoalescedSnapshotTests.csproj -c Release
          node modules/suite/tests/web/test_nav_request_pressure.cjs
      - name: Check incident profiler matching and GC evidence
        run: dotnet run --project modules/suite/tests/IncidentEvidenceChecks/IncidentEvidenceChecks.csproj -c Release
      - name: Check save correlation and retention query work
        run: |
          dotnet run --project modules/suite/tests/SaveCorrelationChecks/SaveCorrelationChecks.csproj -c Release
          python3 modules/suite/tests/test_retention_seek_cost.py
      - name: Check storage startup and failure preservation
        run: dotnet run --project modules/suite/tests/StorageStartupChecks/StorageStartupChecks.csproj -c Release
      - name: Check packet budgets and conservative flood/reach confirmation
        run: dotnet run --project modules/suite/tests/packetguard/PacketIngressPolicyTests.csproj -c Release
      - name: Check Discord event formatting and storm transitions
        run: dotnet run --project tests/discord-events/DiscordEventTests.csproj -c Release
      - name: Check optimizer profiler data structures
        run: dotnet run --project modules/optimizer/tests/ProfilerTests/ProfilerTests.csproj -c Release
      - name: Check probe capture analysis
        run: python3 -m unittest discover -s modules/optimizer/tools/probe/tests -v
      - name: Check post-builder behavior
        run: node tests/editor-checks.js tests/web/motd-editor-Declarations.js
      - name: Validate embedded editor fixtures
        run: |
          node --check tests/web/motd-editor-Declarations.js
          node --check tests/web/motd-editor-Bindings.js
          python3 tools/check_sources.py
